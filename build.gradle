plugins {
    // Minecraft 26.1+ is unobfuscated. Use the new NON-remapping loom plugin
    // (net.fabricmc.fabric-loom) instead of the old 'fabric-loom'.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"

    // NOTE: Publishing plugins are commented out for the 26.1 port.
    //  - com.matthewprenger.cursegradle 1.4.0 is NOT compatible with Gradle 9.x.
    //  - Re-enable/replace these once a Gradle 9 compatible publishing setup is chosen.
    //  - The modrinth/curseforge config blocks were removed for the same reason; the
    //    old ones referenced the now-removed `remapJar` task.
    // id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 5, 'minutes'
    }
}

repositories {
    mavenCentral()
    maven {
        name = "sonatype-oss-snapshots"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven { url 'https://jitpack.io' }
    // NOTE: maven.bymartrixx.me was removed for the 26.1 port — its DNS no longer
    // resolves and an unreachable repo aborts dependency resolution. placeholder-api
    // is fetched from maven.nucleoid.xyz instead.
    maven { url "https://repo.erdbeerbaerlp.de/repository/maven-public/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.nucleoid.xyz/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No `mappings` line: Minecraft 26.1+ ships with official Mojang names already.
    // No `modImplementation`: the non-remapping loom plugin does not remap mods,
    // so plain `implementation` / `compileOnly` are used.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include(implementation("eu.pb4:placeholder-api:${project.placeholder_api_version}"))
    compileOnly "maven.modrinth:styled-chat:${project.styled_chat_version}"

    // =========  Common  =====================
    include(implementation("de.erdbeerbaerlp:dcintegration.common:${project.dcintegration_common_version}") {
        changing = true
        transitive = false
    })
    include(implementation("me.lucko:fabric-permissions-api:${project.permissions_api_version}"))
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
}

base {
    archivesName = project.archives_base_name
}

// No remapJar anymore (Minecraft is unobfuscated) -> configure the plain jar task.
jar {
    archiveClassifier = project.minecraft_version
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
